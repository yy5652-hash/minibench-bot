[project]
name = "shelfcast"
version = "0.1.0"
description = "Calibrated demand forecasts that become restocking decisions, served by an open LLM on AMD Instinct GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
shelfcast = "shelfcast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shelfcast"]

[tool.setuptools.package-data]
shelfcast = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
