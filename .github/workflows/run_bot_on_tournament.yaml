name: Forecast on FutureEval and MiniBench

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs. With cancel-in-progress false, one run waits behind the running one and
# starts as soon as it ends.
concurrency:
  group: metaculus-forecast-publisher
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    timeout-minutes: 358 # GitHub's limit for a job is 360
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --only main --no-interaction --no-root
      - name: Run bot
        # GitHub starts scheduled runs late (asked for every 20 minutes, they came 2 to 5 hours apart in October), and a
        # MiniBench question is open for only a few hours, so one run keeps looking for open questions every five minutes
        # for almost six hours; the concurrency group then starts the next run at once. A pass with no open question
        # makes no model call; already-forecast questions are skipped.
        run: |
          stop=$(( $(date +%s) + 340 * 60 ))
          while :; do
            poetry run python main.py --mode tournament --publish --predictions "${{ vars.PREDICTIONS_PER_QUESTION || '5' }}" \
              || echo "This pass failed; the next one starts in five minutes."
            if [ $(( $(date +%s) + 300 )) -ge "$stop" ]; then break; fi
            sleep 300
          done
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # Free Gemini tier by default; set repository variables to override.
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL || 'gemini/gemini-3.5-flash-lite' }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'gemini/gemini-3.5-flash-lite' }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL || 'gemini/gemini-3.5-flash-lite' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MAX_REQUESTS_PER_RUN: ${{ vars.GEMINI_MAX_REQUESTS_PER_RUN || '200' }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Save inventory and forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecasts-${{ github.run_id }}
          path: forecast-output/
          if-no-files-found: ignore
          retention-days: 14
