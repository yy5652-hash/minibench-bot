name: Diagnose and Preview Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Tournament to inspect
        type: choice
        options: [minibench, test_questions]
        default: minibench
      inventory_only:
        description: Only list open questions; no model calls
        type: boolean
        default: true
      limit:
        description: Maximum questions for a nonpublishing preview
        type: choice
        options: ["1", "3", "10", "0"]
        default: "1"
  push:
    branches: [codex/repair-minibench]

permissions:
  contents: read

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    timeout-minutes: 30
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --only main --no-interaction --no-root
      - name: Run bot
        run: |
          args=(--mode "$BOT_MODE" --limit "$BOT_LIMIT")
          if [ "$INVENTORY_ONLY" = "true" ]; then args+=(--inventory-only); fi
          poetry run python main.py "${args[@]}"
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          BOT_MODE: ${{ inputs.mode || 'minibench' }}
          BOT_LIMIT: ${{ inputs.limit || '1' }}
          INVENTORY_ONLY: ${{ github.event_name == 'push' || inputs.inventory_only }}
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Save inventory and forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-preview-${{ github.run_id }}
          path: forecast-output/
          if-no-files-found: ignore
          retention-days: 14
